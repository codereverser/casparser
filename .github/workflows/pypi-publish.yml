name: Upload Python Package

# `published` (not `created`): a release drafted first and published later
# only fires `published` — `created` fires at draft time, when workflows
# don't run. `workflow_dispatch` allows re-firing a missed release manually.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    environment: pypi
    permissions:
      id-token: write
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
    - name: Build
      run: uv build
    - name: Publish
      run: uv publish
